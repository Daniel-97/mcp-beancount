services:
  beancount-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: beancount-mcp:local
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - "${BEANCOUNT_LEDGER_DIR:?Set BEANCOUNT_LEDGER_DIR to the directory containing main.bean}:/ledger"
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    stop_grace_period: 10s
